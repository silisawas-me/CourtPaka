<section class="card">
  <h1>{{ i18n.t('verify.title') }}</h1>

  @switch (state()) {
    @case ('working') {
      <p data-testid="verify-working">{{ i18n.t('verify.working') }}</p>
    }
    @case ('done') {
      <p class="success" data-testid="verify-success">{{ i18n.t('verify.success') }}</p>
      <p>
        <a routerLink="/">{{ i18n.t('app.name') }}</a>
      </p>
    }
    @case ('failed') {
      <p class="form-error" data-testid="verify-error">{{ i18n.t(errorKey()) }}</p>
      <p>
        <a routerLink="/resend-verification">{{ i18n.t('login.resendVerification') }}</a>
      </p>
    }
  }
</section>
