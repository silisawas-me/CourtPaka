<section class="card">
  <h1>{{ i18n.t('login.title') }}</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label for="email">{{ i18n.t('common.email') }}</label>
    <input id="email" type="email" formControlName="email" autocomplete="email" />
    <app-field-error [control]="form.controls.email" testId="email-error" />

    <label for="password">{{ i18n.t('common.password') }}</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
    />
    <app-field-error [control]="form.controls.password" testId="password-error" />

    @if (errorKey(); as key) {
      <p class="form-error" data-testid="form-error">{{ i18n.t(key) }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ i18n.t(submitting() ? 'common.loading' : 'login.submit') }}
    </button>
  </form>

  <p>
    {{ i18n.t('login.needAccount') }}
    <a routerLink="/register">{{ i18n.t('nav.signUp') }}</a>
  </p>
  <p>
    <a routerLink="/resend-verification">{{ i18n.t('login.resendVerification') }}</a>
  </p>
</section>
