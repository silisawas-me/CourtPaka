<mat-card>
  <mat-card-header>
    <mat-card-title data-testid="page-title">{{ i18n.t('login.title') }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form class="stack" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <mat-form-field class="field">
        <mat-label>{{ i18n.t('common.email') }}</mat-label>
        <input matInput id="email" type="email" formControlName="email" autocomplete="email" />
        <mat-error [appFieldError]="form.controls.email" testId="email-error"></mat-error>
      </mat-form-field>

      <mat-form-field class="field">
        <mat-label>{{ i18n.t('common.password') }}</mat-label>
        <input
          matInput
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
        <mat-error [appFieldError]="form.controls.password" testId="password-error"></mat-error>
      </mat-form-field>

      @if (formError(); as key) {
        <p class="form-error" data-testid="form-error">{{ i18n.t(key) }}</p>
      }

      <button matButton="filled" type="submit" [disabled]="submitting()">
        {{ i18n.t(submitting() ? 'common.loading' : 'login.submit') }}
      </button>
    </form>
  </mat-card-content>

  <mat-card-actions class="row">
    <span class="muted">{{ i18n.t('login.needAccount') }}</span>
    <a matButton routerLink="/register">{{ i18n.t('nav.signUp') }}</a>
    <a matButton routerLink="/resend-verification">{{ i18n.t('login.resendVerification') }}</a>
  </mat-card-actions>
</mat-card>
