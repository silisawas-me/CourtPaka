<mat-card>
  <mat-card-header>
    <mat-card-title>{{ i18n.t('resend.title') }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    @if (done()) {
      <p class="success" data-testid="resend-done">{{ i18n.t('resend.done') }}</p>
    } @else {
      <form class="stack" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <mat-form-field class="field">
          <mat-label>{{ i18n.t('common.email') }}</mat-label>
          <input matInput id="email" type="email" formControlName="email" autocomplete="email" />
          <mat-error [appFieldError]="form.controls.email" testId="email-error"></mat-error>
        </mat-form-field>

        @if (errorKey(); as key) {
          <p class="form-error" data-testid="form-error">{{ i18n.t(key) }}</p>
        }

        <button matButton="filled" type="submit" [disabled]="submitting()">
          {{ i18n.t(submitting() ? 'common.loading' : 'resend.submit') }}
        </button>
      </form>
    }
  </mat-card-content>

  @if (done()) {
    <mat-card-actions>
      <a matButton="filled" routerLink="/login">{{ i18n.t('login.title') }}</a>
    </mat-card-actions>
  }
</mat-card>
