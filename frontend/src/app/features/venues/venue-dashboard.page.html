@if (tab() === 'close') {
  <app-close-drawer [venueId]="venueId()" />
} @else {
  @if (loading() && figures() === null) {
    <mat-progress-bar mode="indeterminate" />
  } @else if (pageError(); as key) {
    <mat-card>
      <mat-card-content>
        <p class="form-error" data-testid="page-error">{{ i18n.t(key) }}</p>
      </mat-card-content>
    </mat-card>
  } @else if (figures(); as f) {
    @if (loading()) {
      <mat-progress-bar mode="indeterminate" />
    }
    <app-revenue-panel [figures]="f" [fortnight]="true" />
  }
}
