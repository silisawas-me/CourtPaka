name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What this change actually touched. Everything below asks this rather than running anyway:
  # a private repository pays for its minutes, and fifteen of them to check that a sentence in
  # a Markdown file has not broken a Docker build is fifteen minutes that buy nothing.
  #
  # The workflow is in every list, so a change to CI itself is always checked in full.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.what.outputs.backend }}
      frontend: ${{ steps.what.outputs.frontend }}
      stack: ${{ steps.what.outputs.stack }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Both sides of the comparison below have to be here.
          fetch-depth: 0

      - id: what
        name: Work out what was touched
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A push to a branch nobody has seen before has no "before" to compare with, and a
          # forced push can name a commit that is gone. Either way the safe answer is everything.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No base to compare against; checking everything."
            touched=""
          else
            touched=$(git diff --name-only "$BASE" HEAD)
            echo "Touched:"; echo "$touched"
          fi

          matches() {
            [ -z "$touched" ] && { echo true; return; }
            echo "$touched" | grep -Eq "$1" && echo true || echo false
          }

          {
            echo "backend=$(matches '^(backend/|\.github/workflows/)')"
            echo "frontend=$(matches '^(frontend/|\.github/workflows/)')"
            echo "stack=$(matches '^(backend/|frontend/|scripts/|docker-compose|\.github/workflows/)')"
          } >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # The runner is thrown away after the job, so the Testcontainers reaper adds a pull for nothing.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # NuGet audit runs here and fails the job on critical advisories (backend/Directory.Build.props).
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Integration tests start a real PostgreSQL via Testcontainers (Docker is available on ubuntu runners).
      - name: Test
        run: dotnet test --no-build -c Release

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build

      - name: Check formatting
        run: npm run format:check

      - name: Fail on vulnerable packages
        run: npm audit --omit=dev --audit-level=high

  # Runs alongside the test jobs: it verifies the images build, it does not gate on tests.
  docker:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # UAT runs on ARM64 (Oracle Cloud) and PRD on AMD64. Both Dockerfiles cross-compile from the
      # native platform, so no emulation is needed; PRs only build AMD64 to keep feedback fast.
      - name: Select platforms
        id: platforms
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=linux/amd64" >> "$GITHUB_OUTPUT"
          else
            echo "value=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: ${{ steps.platforms.outputs.value }}
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=min,scope=api

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: ${{ steps.platforms.outputs.value }}
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=min,scope=web

  # The browser checks (scripts/verify), against the same stack a person would run them on.
  # They are what catches a flow that broke without a unit test noticing — a calendar that stopped
  # opening, a grid that stopped refreshing — and CI is where that has to be noticed, not the next
  # time somebody remembers to run them by hand.
  #
  # A subset, chosen for coverage per minute: the public grid and a booking through it, the venue
  # side of a slip, the money crossing the counter, and signing in with LINE. The rest stay a
  # local command (scripts/verify/README).
  flows:
    needs: changes
    # Skipped on a draft: the flow scripts stands the whole stack up, which is seven of this
    # workflow's fifteen billed minutes between the two of them, and a branch still being
    # written is not a branch to spend that on. Marking the pull request ready runs them.
    if: >-
      needs.changes.outputs.stack == 'true'
      && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Start the stack
        run: docker compose --profile full up -d --build --wait

      - name: Run the flows
        run: |
          for check in doors venue_shell close_drawer counter_money walk_in now_board timeline booking_list venue_setup staff_invite; do
            echo "== $check"
            python scripts/verify/$check.py
          done

      - name: Keep the screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: flow-screenshots
          path: scripts/verify/shots
          retention-days: 7

      - name: What the API said
        if: failure()
        run: docker compose logs --no-log-prefix api | tail -200

  # PRD 8: an OWASP ZAP baseline scan of the running stack, and no High alert allowed. The stack is
  # the local one (Development settings, plain HTTP) behind the same Caddyfile the deployments
  # use, which is where the headers the scan reads are set.
  zap:
    needs: changes
    # Skipped on a draft: the security scan stands the whole stack up, which is seven of this
    # workflow's fifteen billed minutes between the two of them, and a branch still being
    # written is not a branch to spend that on. Marking the pull request ready runs them.
    if: >-
      needs.changes.outputs.stack == 'true'
      && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: docker compose --profile full up -d --build --wait

      # -I: never fail on a warning. ZAP marks every rule WARN, so "no High" is decided below.
      - name: ZAP baseline scan
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 -J report.json -I

      - name: Fail on High alerts
        run: python3 scripts/ci/zap_high.py zap/report.json

      # Only when the scan says something. A report nobody opens still spends the storage the
      # next run needs, and a full store fails the upload — which failed the gate that had passed.
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: zap/report.json
          retention-days: 7
