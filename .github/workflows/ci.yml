name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # The runner is thrown away after the job, so the Testcontainers reaper adds a pull for nothing.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # NuGet audit runs here and fails the job on critical advisories (backend/Directory.Build.props).
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Integration tests start a real PostgreSQL via Testcontainers (Docker is available on ubuntu runners).
      - name: Test
        run: dotnet test --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build

      - name: Fail on critical vulnerable packages
        run: npm audit --omit=dev --audit-level=critical

  # Runs alongside the test jobs: it verifies the images build, it does not gate on tests.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # UAT runs on ARM64 (Oracle Cloud) and PRD on AMD64. Both Dockerfiles cross-compile from the
      # native platform, so no emulation is needed; PRs only build AMD64 to keep feedback fast.
      - name: Select platforms
        id: platforms
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=linux/amd64" >> "$GITHUB_OUTPUT"
          else
            echo "value=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: ${{ steps.platforms.outputs.value }}
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=min,scope=api

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: ${{ steps.platforms.outputs.value }}
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=min,scope=web
