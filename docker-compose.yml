# Local development stack.
#   docker compose up -d db              -> PostgreSQL only (run API/web from the SDKs)
#   docker compose --profile full up -d  -> full stack from Docker images, http://localhost:8080
# Credentials below are for local development only; the port is bound to 127.0.0.1.
# Deploy-time compose files for UAT/PRD (image tags, domains, real secrets) come with the deploy workflow.
name: court-booking

x-db-credentials: &db-credentials
  POSTGRES_DB: courtbooking
  POSTGRES_USER: courtbooking
  POSTGRES_PASSWORD: courtbooking_dev

services:
  db:
    image: postgres:17-alpine
    environment: *db-credentials
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: [full]
    build: ./backend
    environment:
      # This stack is a development one; deployed environments run as Production (PRD 9.3, 9.4).
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=courtbooking;Username=courtbooking;Password=courtbooking_dev"
      App__BaseUrl: "http://localhost:8080"
      App__PrivacyPolicyVersion: "2026-09-01"
      # The agreement a venue accepts when it applies (PRD US-10). Wording waits on Q8.
      App__VenueAgreementVersion: "2026-09-01"
      # Who acts for the platform here (PRD US-20). A deployment names real people instead.
      App__PlatformAdmins__0: "admin@courtpaka.local"
      # Local stack is plain HTTP; deployed environments leave this at its secure default.
      App__RequireSecureCookies: "false"
      # Local convenience: deployments run the migration bundle from the deploy job instead (PRD 9.4).
      App__ApplyMigrationsOnStartup: "true"
      # Local stack starts with a venue, an owner and a staff account (see DevelopmentSeeder).
      App__SeedDevelopmentData: "true"
      # Four made-up branches with a fortnight of trade; SEED_MOCK_DATA=false for a bare stack.
      App__SeedMockData: "${SEED_MOCK_DATA:-true}"
      # "1" / "1" signs in as the owner of the mock branches (Development only).
      App__DevQuickLogin: "true"
      # Booker emails/LINE link to pages that were taken out; off until a booker app (TELL_BOOKERS=true).
      App__TellBookers: "${TELL_BOOKERS:-false}"
      # The verify scripts make bookers through sign-up; deployments keep it closed (invite only).
      App__OpenSignUp: "${OPEN_SIGNUP:-true}"
      # Keeps auth cookies valid across restarts.
      App__DataProtectionKeysPath: "/keys"
      # End-to-end runs come from one IP; the deployed default of 10/minute is for real users.
      App__AuthRequestsPerMinute: "200"
      # The browser checks wait for the caretaker to do a round, so it goes round often here.
      # Deployments leave it at the default minute (PRD 9.2).
      App__CaretakerIntervalSeconds: "10"
      # Payment slips. A volume, because a rebuilt container must not lose them.
      App__SlipStoragePath: "/slips"
      # The browser checks upload more than a person would.
      App__UploadsPerHour: "200"
      # Signing in with LINE, against a stand-in LINE that only a Development host will wire up
      # (PRD US-01). A deployment sets App__Line__ChannelId and __ChannelSecret instead.
      App__Line__UseDevelopmentFake: "true"
      # Telling a booker on LINE (PRD US-34). The stand-in messenger logs what it would have
      # pushed; a deployment sets App__Line__MessagingToken and gets the real push endpoint.
    volumes:
      - api-keys:/keys
      - api-slips:/slips
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The chiseled runtime image has no shell or curl, so ask the runtime itself.
      # Liveness only: a database outage must not mark the API container unhealthy.
      test: ["CMD", "dotnet", "/app/CourtBooking.Api.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    profiles: [full]
    build: ./frontend
    environment:
      SITE_ADDRESS: ":80"
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  api-keys:
  api-slips:
